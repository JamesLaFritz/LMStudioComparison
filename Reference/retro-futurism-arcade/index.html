<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060f" />

    <!--
      Inline SVG data URI, not a .ico. The directive bans external asset files,
      and a missing favicon is not free: the browser requests /favicon.ico
      regardless, and the resulting 404 is a console error that the acceptance
      gate's "boots without throwing" check counts against the build.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 8'%3E%3Crect width='11' height='8' fill='%23071417'/%3E%3Cpath fill='%2357e2ff' d='M2 1h1v1H2zM8 1h1v1H8zM3 2h5v1H3zM2 3h1v1H2zM4 3h1v1H4zM6 3h1v1H6zM8 3h1v1H8zM1 4h9v1H1zM0 5h2v1H0zM9 5h2v1H9zM3 5h5v1H3zM2 6h1v1H2zM8 6h1v1H8z'/%3E%3C/svg%3E"
    />
    <title>NEON BULWARK — Retro-Futurism Arcade</title>
    <meta
      name="description"
      content="A procedurally generated, physically based reimagining of the 1978 arcade canon. Three.js, zero external assets."
    />
  </head>
  <body>
    <!-- The single WebGL surface. Owned by RendererFactory for the whole session. -->
    <div id="viewport" aria-hidden="true"></div>

    <!-- DOM overlay root. All HUD, menus and modals live here, never in WebGL. -->
    <div id="overlay-root"></div>

    <noscript>
      <div class="noscript-panel">
        This arcade is built entirely in code and requires JavaScript and WebGL 2.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
