<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders — AAA Retro-Futurism</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- HUD Overlay -->
  <div id="hud">
    <div class="hud-panel left">
      <div class="hud-label">SCORE</div>
      <div id="score-display" class="hud-value neon-cyan">0</div>
    </div>
    <div class="hud-panel center">
      <div id="wave-display" class="hud-wave">WAVE 1</div>
    </div>
    <div class="hud-panel right">
      <div class="hud-label">LIVES</div>
      <div id="lives-display" class="hud-value neon-cyan"></div>
    </div>
    <div class="hud-panel bottom-center">
      <div class="hud-label">HIGH SCORE</div>
      <div id="highscore-display" class="hud-value neon-magenta">0</div>
    </div>
  </div>

  <!-- Floating Score Text Container -->
  <div id="floating-texts"></div>

  <!-- Hit-Stop Flash Overlay -->
  <div id="flash-overlay"></div>

  <!-- Game Over Screen -->
  <div id="game-over" class="overlay hidden">
    <h1 class="go-title neon-cyan">GAME OVER</h1>
    <p class="go-score">SCORE: <span id="final-score">0</span></p>
    <p class="go-highscore">HIGH SCORE: <span id="final-highscore">0</span></p>
    <button id="restart-btn" class="neon-btn">RESTART</button>
  </div>

  <!-- Wave Transition Overlay -->
  <div id="wave-transition" class="overlay hidden">
    <h1 id="wave-text" class="wave-title neon-cyan"></h1>
  </div>

  <!-- Controls Hint -->
  <div id="controls-hint">
    <span>A/D or ←/→ — Move</span> &nbsp;|&nbsp;
    <span>SPACE or Gamepad A — Fire</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
