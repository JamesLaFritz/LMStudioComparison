<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAA Retro-Futurism Arcade</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #ui-layer > * { pointer-events: auto; }
    #game-selector {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #050510 70%);
    }
    #game-selector h1 {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #0088ff;
      margin-bottom: 2rem;
      text-align: center;
    }
    #game-selector .subtitle {
      font-size: 0.9rem;
      color: #8888cc;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 900px;
      width: 90%;
    }
    .game-btn {
      background: rgba(10, 10, 46, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 12px;
      padding: 1.2rem 1rem;
      color: #c0c0ff;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .game-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }
    .game-btn:hover::before { left: 100%; }
    .game-btn:hover {
      border-color: #00ffff;
      color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.05);
      transform: translateY(-2px);
    }
    .game-btn .difficulty {
      display: block;
      font-size: 0.65rem;
      color: #6666aa;
      margin-top: 0.4rem;
      letter-spacing: 0.1em;
    }
    .game-btn.locked {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    #back-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 200;
      background: rgba(10, 10, 46, 0.8);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      color: #00ffff;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      transition: all 0.3s ease;
    }
    #back-btn:hover {
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-layer"></div>
  <button id="back-btn">← Back</button>

  <div id="game-selector">
    <h1>Retro-Futurism Arcade</h1>
    <div class="subtitle">AAA Reimagined Classics</div>
    <div class="game-grid" id="game-grid"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
