<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON INVADERS — AAA Retro-Futurism</title>
  <style>
    :root {
      --cyan: #00e5ff;
      --magenta: #ff2fd6;
      --amber: #ffb300;
      --green: #39ff88;
      --red: #ff3b5c;
      --glass-bg: rgba(10, 16, 34, 0.55);
      --glass-border: rgba(0, 229, 255, 0.35);
      --text: #d8f6ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03040a; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    /* The `hidden` attribute must win over any display rule below. */
    [hidden] { display: none !important; }

    /* ── HUD shell ─────────────────────────────────────────── */
    .hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 14px 18px;
    }

    /* ── Chips ─────────────────────────────────────────────── */
    .chip {
      display: inline-flex; flex-direction: column; align-items: flex-start;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border-radius: 12px;
      padding: 8px 16px;
      margin-right: 12px;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.12), inset 0 0 12px rgba(0, 229, 255, 0.05);
    }
    .chip-label {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(216, 246, 255, 0.55); margin-bottom: 2px;
    }
    .chip-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .score-chip .chip-value { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
    .wave-chip .chip-value { color: var(--magenta); text-shadow: 0 0 12px rgba(255, 47, 214, 0.7); }
    .lives-chip .chip-value { color: var(--green); letter-spacing: 4px; text-shadow: 0 0 10px rgba(57, 255, 136, 0.7); }
    .combo-chip .chip-value { color: var(--amber); text-shadow: 0 0 12px rgba(255, 179, 0, 0.8); }

    .combo-bar {
      width: 100%; height: 3px; border-radius: 2px; margin-top: 6px;
      background: rgba(255, 179, 0, 0.18); overflow: hidden;
    }
    .combo-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--amber), var(--magenta));
      box-shadow: 0 0 8px rgba(255, 179, 0, 0.8);
    }

    /* ── Power-up chips ────────────────────────────────────── */
    .powerups { display: flex; gap: 8px; align-self: flex-start; }
    .pu-chip {
      min-width: 92px; text-align: center;
      background: var(--glass-bg);
      border: 1px solid color-mix(in srgb, var(--pu-color, var(--amber)) 45%, transparent);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      border-radius: 10px;
      padding: 6px 12px;
    }
    .pu-label {
      display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
      color: var(--pu-color, var(--amber));
      text-shadow: 0 0 8px color-mix(in srgb, var(--pu-color, var(--amber)) 70%, transparent);
      margin-bottom: 4px;
    }
    .pu-bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    .pu-fill {
      height: 100%; width: 100%;
      background: var(--pu-color, var(--amber));
      box-shadow: 0 0 8px var(--pu-color, var(--amber));
    }

    /* ── Banner ────────────────────────────────────────────── */
    .banner {
      position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
      z-index: 18; pointer-events: none;
      font-size: 46px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.9), 0 0 44px rgba(0, 229, 255, 0.5);
      white-space: nowrap;
    }
    .banner-in { animation: bannerIn 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    @keyframes bannerIn {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); letter-spacing: 0.5em; }
      18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      30%  { transform: translate(-50%, -50%) scale(1); }
      78%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
    }

    /* ── Screens ───────────────────────────────────────────── */
    .screens { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(3, 4, 10, 0.25) 0%, rgba(3, 4, 10, 0.72) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .glass.panel {
      pointer-events: auto;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      border-radius: 20px;
      padding: 42px 56px;
      text-align: center;
      box-shadow: 0 0 60px rgba(0, 229, 255, 0.15), inset 0 0 30px rgba(0, 229, 255, 0.04);
      max-width: 560px;
    }
    .panel-title {
      font-size: 44px; font-weight: 800; letter-spacing: 0.14em; line-height: 1.1;
      background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--amber));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.45));
      margin-bottom: 10px;
    }
    .panel-sub {
      font-size: 13px; letter-spacing: 0.2em; color: rgba(216, 246, 255, 0.6);
      margin-bottom: 26px;
    }
    .panel-body { margin-bottom: 28px; }

    .controls-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 18px;
    }
    .controls-grid > div {
      display: flex; flex-direction: column; gap: 3px;
      padding: 10px 8px; border-radius: 10px;
      background: rgba(0, 229, 255, 0.06); border: 1px solid rgba(0, 229, 255, 0.18);
    }
    .controls-grid b { font-size: 11px; letter-spacing: 0.18em; color: var(--cyan); }
    .controls-grid span { font-size: 11px; color: rgba(216, 246, 255, 0.6); }

    .hint { font-size: 12px; line-height: 1.6; color: rgba(216, 246, 255, 0.6); letter-spacing: 0.06em; }

    .panel-buttons { display: flex; gap: 14px; justify-content: center; }
    .neon-btn {
      cursor: pointer;
      font-size: 15px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase;
      color: #041018; background: linear-gradient(90deg, var(--cyan), #7df9ff);
      border: none; border-radius: 12px; padding: 14px 42px;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.55), inset 0 0 8px rgba(255, 255, 255, 0.4);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .neon-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 38px rgba(0, 229, 255, 0.8); }
    .neon-btn:active { transform: translateY(0) scale(0.98); }

    /* ── Floating score text ───────────────────────────────── */
    .float-text {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      font-weight: 800; font-size: 16px; letter-spacing: 0.08em;
      padding: 4px 12px; border-radius: 10px;
      background: rgba(10, 16, 34, 0.5);
      border: 1px solid rgba(0, 229, 255, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* ── CRT overlay ───────────────────────────────────────── */
    .crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 30;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14) 0px, rgba(0, 0, 0, 0.14) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
      opacity: 0.55;
    }
    .crt::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.5) 100%);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
