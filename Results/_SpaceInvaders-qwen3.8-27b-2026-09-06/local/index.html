<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro-Futurism Arcade</title>
  <style>
    :root {
      --cyan: #00e5ff;
      --magenta: #ff2d95;
      --bg: #05060f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0, 90, 140, 0.35), transparent 60%),
        radial-gradient(900px 500px at 85% 110%, rgba(120, 20, 90, 0.28), transparent 60%),
        var(--bg);
      color: #e8f4ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    header { text-align: center; margin-bottom: 44px; }
    .kicker {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(160, 220, 255, 0.7);
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      font-weight: 800;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 22px rgba(0, 229, 255, 0.45));
    }
    .tagline {
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: 1px;
      color: rgba(200, 235, 255, 0.75);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px 18px 18px;
      min-height: 150px;
      border-radius: 16px;
      background: rgba(10, 14, 30, 0.42);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(0, 229, 255, 0.22);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.10), inset 0 0 12px rgba(0, 229, 255, 0.04);
      text-decoration: none;
      color: inherit;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      overflow: hidden;
    }
    .card.playable { cursor: pointer; }
    .card.playable:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.6);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.35), inset 0 0 16px rgba(0, 229, 255, 0.08);
    }
    .card .num {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(160, 220, 255, 0.55);
    }
    .card .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .card .desc {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(200, 235, 255, 0.65);
      flex: 1;
    }
    .card .status {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .card.playable .status { color: var(--cyan); }
    .card.locked { opacity: 0.55; cursor: default; }
    .card.locked .status { color: rgba(255, 45, 149, 0.8); }
    .card .glow {
      position: absolute;
      inset: auto -30% -60% auto;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.25), transparent 70%);
      pointer-events: none;
    }
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(160, 220, 255, 0.45);
    }
    footer .dot { color: var(--magenta); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">14-Game Cabinet · 100% Procedural</div>
      <h1>Retro-Futurism Arcade</h1>
      <div class="tagline">Hand-written physics · PBR neon · UnrealBloom · no engines, no assets, no files</div>
    </header>
    <div class="grid" id="grid"></div>
    <footer>
      <span class="dot">●</span> Built with Three.js + Vite · Glassmorphism HUD · Unified keyboard + gamepad
    </footer>
  </div>

  <script type="module">
    // Game roster. `path` present => playable; absent => locked (not yet built).
    const GAMES = [
      { name: 'Space Invaders', desc: 'Defend the line against the descending swarm.', path: 'Space_Invaders/index.html' },
      { name: 'Pong',           desc: 'The original duel, reimagined in neon.' },
      { name: 'Snake',          desc: 'Grow the chain, dodge your own tail.' },
      { name: 'Breakout',       desc: 'Shatter the wall, keep the ball alive.' },
      { name: 'Tetris',         desc: 'Stack the blocks, clear the lines.' },
      { name: 'Pac-Man',        desc: 'Eat the maze, outrun the ghosts.' },
      { name: 'Asteroids',      desc: 'Split the rocks, dodge the wrap.' },
      { name: 'Frogger',        desc: 'Cross the road, swim the river.' },
      { name: 'Centipede',      desc: 'Break the chain, clear the field.' },
      { name: 'Galaga',         desc: 'Fight through the formation.' },
      { name: 'Defender',       desc: 'Sweep the field, save the pods.' },
      { name: 'Donkey Kong',    desc: 'Climb the girders, dodge the barrels.' },
      { name: 'Paperboy',       desc: 'Deliver the paper, dodge the chaos.' },
      { name: 'TMNT',           desc: 'Slice through the alley.' },
    ];

    const grid = document.getElementById('grid');
    GAMES.forEach((g, i) => {
      const card = document.createElement(g.path ? 'a' : 'div');
      card.className = 'card ' + (g.path ? 'playable' : 'locked');
      if (g.path) card.href = g.path;
      card.innerHTML = `
        <div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="name">${g.name}</div>
        <div class="desc">${g.desc}</div>
        <div class="status">${g.path ? '▶ Play' : 'Soon'}</div>
        ${g.path ? '<div class="glow"></div>' : ''}
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
