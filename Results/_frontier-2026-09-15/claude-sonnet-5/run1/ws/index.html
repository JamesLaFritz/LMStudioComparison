<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAA Retro Arcade Collection</title>
  <link rel="stylesheet" href="/shared/ui/glass.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #131327 0%, #05050c 70%);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .launcher {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 320px;
    }
    .launcher h1 {
      color: #eafcff;
      text-shadow: 0 0 12px rgba(80, 220, 255, 0.8);
      text-align: center;
      margin-bottom: 8px;
    }
    .launcher a.glass-panel {
      text-decoration: none;
      color: #eafcff;
      padding: 18px 24px;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="launcher">
    <h1>RETRO-FUTURE ARCADE</h1>
    <a class="glass-panel neon-cyan" href="/Space_Invaders/index.html">SPACE INVADERS</a>
  </div>
</body>
</html>
