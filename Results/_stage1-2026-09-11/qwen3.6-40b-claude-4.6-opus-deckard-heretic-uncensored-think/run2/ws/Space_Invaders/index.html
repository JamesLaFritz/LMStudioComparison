<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders - Retro-Futurism Edition</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas will be inserted here by Three.js -->
        
        <!-- Glassmorphism UI Overlay -->
        <div class="ui-overlay">
            <!-- Top HUD -->
            <div class="hud-top">
                <div class="score-display glass-panel">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                
                <div class="level-display glass-panel">
                    <span class="label">LEVEL</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>
            
            <!-- Lives display -->
            <div class="lives-container">
                <div id="lives-display"></div>
            </div>
        </div>
        
        <!-- Game Over Screen (hidden by default) -->
        <div id="game-over" class="overlay-screen hidden">
            <div class="glass-panel center-panel">
                <h1 id="game-over-title">GAME OVER</h1>
                <p class="final-score">Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="neon-button">PLAY AGAIN</button>
            </div>
        </div>
        
        <!-- Pause Screen (hidden by default) -->
        <div id="pause-screen" class="overlay-screen hidden">
            <div class="glass-panel center-panel">
                <h1>PAUSED</h1>
                <button id="resume-btn" class="neon-button">RESUME</button>
            </div>
        </div>
        
        <!-- Instructions -->
        <div class="instructions glass-panel">
            <p><strong>Controls:</strong></p>
            <p>← → or A D — Move</p>
            <p>Space / Z — Fire</p>
            <p>P — Pause</p>
        </div>
    </div>
    
    <!-- Floating score container -->
    <div id="floating-scores"></div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
