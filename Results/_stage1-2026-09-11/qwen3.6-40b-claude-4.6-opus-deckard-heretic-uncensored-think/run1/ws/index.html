<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders - Retro Futurism</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
        }
        canvas { display: block; width: 100%; height: 100vh; }
        
        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        
        .neon-text {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }
        
        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            padding: 10px 30px;
        }
        
        .health-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff4444, #44ff44);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .menu-panel {
            width: 400px;
            padding: 30px;
            text-align: center;
        }
        
        .menu-title {
            font-size: 48px;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { opacity: 1; filter: brightness(1); }
            to { opacity: 0.7; filter: brightness(1.5); }
        }
        
        .menu-button {
            width: 200px;
            height: 60px;
            margin: 15px auto;
            font-size: 24px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ffcc;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <!-- Score Display -->
        <div class="score-display glass-panel neon-text" style="display: none;">
            <span id="score-value">0</span>
        </div>
        
        <!-- Health Bar -->
        <div class="health-bar glass-panel" style="display: none;">
            <div class="health-fill" id="health-fill"></div>
        </div>
        
        <!-- Main Menu -->
        <div class="menu-overlay" id="main-menu">
            <div class="glass-panel menu-panel">
                <h1 class="menu-title neon-text">SPACE INVADERS</h1>
                <button class="menu-button glass-panel neon-text" onclick="startGame()">START GAME</button>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div class="menu-overlay" id="game-over-screen" style="display: none;">
            <div class="glass-panel menu-panel">
                <h1 class="menu-title neon-text" id="game-result"></h1>
                <p class="neon-text" style="font-size: 24px; margin: 20px 0;">Score: <span id="final-score">0</span></p>
                <button class="menu-button glass-panel neon-text" onclick="restartGame()">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/Space_Invaders/index.js"></script>
</body>
</html>
