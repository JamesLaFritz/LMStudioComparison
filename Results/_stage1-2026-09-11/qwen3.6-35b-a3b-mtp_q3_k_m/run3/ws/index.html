<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro-Futuristic Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1e; font-family: 'Courier New', monospace; }
    #game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    #ui-overlay > * { pointer-events: auto; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-overlay"></div>
  <script type="module" src="/games/space_invaders/main.js"></script>
</body>
</html>
