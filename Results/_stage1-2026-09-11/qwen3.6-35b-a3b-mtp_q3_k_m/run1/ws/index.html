<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders — Retro-Futurism</title>
  <link rel="stylesheet" href="./shared/ui/styles.css" />
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a1a; }
    canvas { display: block; }

    /* HUD Overlay */
    #hud-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
    }

    /* Score Panel */
    #score-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px;
      padding: 10px 30px; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
      text-align: center;
    }
    #score-display {
      font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold;
      color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    }

    /* Lives Panel */
    #lives-panel {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px; padding: 8px 20px;
    }
    #lives-display {
      font-family: 'Courier New', monospace; font-size: 16px; color: #00ff88; text-shadow: 0 0 8px #00ff88;
    }

    /* Wave Panel */
    #wave-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px; padding: 10px 20px;
    }
    #wave-display {
      font-family: 'Courier New', monospace; font-size: 18px; color: #ff00ff; text-shadow: 0 0 8px #ff00ff;
    }

    /* Combo Display */
    #combo-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 0, 255, 0.3); border-radius: 8px; padding: 10px 20px;
    }
    #combo-display {
      font-family: 'Courier New', monospace; font-size: 16px; color: #ff00ff; text-shadow: 0 0 8px #ff00ff;
    }

    /* Game Over Screen */
    #game-over-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 15, 0.9); backdrop-filter: blur(4px);
      flex-direction: column; align-items: center; justify-content: center;
    }
    #game-over-screen.active { display: flex; }
    #game-over-title {
      font-family: 'Courier New', monospace; font-size: 64px; font-weight: bold;
      color: #ff0044; text-shadow: 0 0 20px #ff0044, 0 0 40px #ff0044; margin-bottom: 20px;
    }
    #game-over-score {
      font-family: 'Courier New', monospace; font-size: 32px; color: #00ffff; text-shadow: 0 0 10px #00ffff; margin-bottom: 40px;
    }
    #game-over-hint {
      font-family: 'Courier New', monospace; font-size: 20px; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    /* Wave Transition */
    #wave-transition {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 15, 0.8); backdrop-filter: blur(2px);
      flex-direction: column; align-items: center; justify-content: center;
    }
    #wave-transition.active { display: flex; }
    #wave-transition-text {
      font-family: 'Courier New', monospace; font-size: 72px; font-weight: bold;
      color: #00ffff; text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
    }

    /* Floating Score Text */
    .floating-text {
      position: absolute; font-family: 'Courier New', monospace; font-size: 20px;
      font-weight: bold; color: #ffffff; text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
      pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="hud-overlay">
    <div id="score-panel"><div id="score-display">SCORE: 0</div></div>
    <div id="lives-panel"><div id="lives-display">LIVES: ♥♥♥</div></div>
    <div id="wave-panel"><div id="wave-display">WAVE 1</div></div>
    <div id="combo-panel"><div id="combo-display">COMBO x1</div></div>

    <!-- Game Over Screen -->
    <div id="game-over-screen">
      <div id="game-over-title">GAME OVER</div>
      <div id="game-over-score">SCORE: 0</div>
      <div id="game-over-hint">PRESS SPACE TO RESTART</div>
    </div>

    <!-- Wave Transition -->
    <div id="wave-transition"><div id="wave-transition-text">WAVE 1</div></div>
  </div>

  <script type="module" src="./games/Space_Invaders/main.ts"></script>
</body>
</html>
