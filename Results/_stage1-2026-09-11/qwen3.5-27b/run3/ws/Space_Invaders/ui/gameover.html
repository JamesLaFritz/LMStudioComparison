<div class="game-over-content">
  <h1 class="glitch" data-text="GAME OVER">GAME OVER</h1>
  <div class="score-display">
    <p>FINAL SCORE</p>
    <span class="final-score">0</span>
  </div>
  <div class="high-score-display">
    <p>HIGH SCORE</p>
    <span class="high-score">0</span>
  </div>
  <p class="new-high-score hidden">NEW HIGH SCORE!</p>
  <div class="button-group">
    <button id="restart-btn" class="neon-button primary">PLAY AGAIN</button>
    <button id="menu-btn" class="neon-button secondary">MAIN MENU</button>
  </div>
</div>
