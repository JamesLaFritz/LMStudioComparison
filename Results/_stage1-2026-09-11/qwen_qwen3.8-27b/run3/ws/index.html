<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Space Invaders — Neon Arcade</title>
    <style>
      :root {
        --neon-cyan: #35f0ff;
        --neon-magenta: #ff3df0;
        --neon-gold: #ffd23d;
        --bg: #04060d;
        --text-hi: #eaf6ff;
        --text-lo: #9fb8d8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-hi);
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #game { position: absolute; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; }

      /* ── HUD ─────────────────────────────────────────────────── */
      .hud {
        position: absolute; inset: 0;
        pointer-events: none;
        z-index: 10;
        font-family: 'Cascadia Code', 'Consolas', 'SF Mono', monospace;
      }
      .hud-top {
        position: absolute; top: 14px; left: 0; right: 0;
        display: flex; justify-content: space-between;
        padding: 0 22px;
      }
      .hud-bottom {
        position: absolute; bottom: 14px; left: 0; right: 0;
        display: flex; justify-content: space-between; align-items: flex-end;
        padding: 0 22px;
      }
      .hud-block {
        display: flex; flex-direction: column; gap: 3px;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(10, 14, 28, 0.45);
        border: 1px solid rgba(120, 220, 255, 0.18);
        backdrop-filter: blur(8px) saturate(1.3);
        -webkit-backdrop-filter: blur(8px) saturate(1.3);
      }
      .hud-label {
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--text-lo);
      }
      .hud-value {
        font-size: 20px; font-weight: 700;
        color: var(--text-hi);
        text-shadow: 0 0 10px rgba(53, 240, 255, 0.5);
        line-height: 1;
      }
      .hud-score .hud-value { color: var(--neon-cyan); }
      .hud-high .hud-value { color: var(--neon-gold); }
      .hud-wave .hud-value { color: var(--neon-magenta); }

      /* lives */
      .life {
        display: inline-block; width: 14px; height: 10px;
        margin-right: 4px;
        background: linear-gradient(180deg, var(--neon-cyan), #0a2a44);
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .life-off { opacity: 0.22; background: #223344; }

      /* combo bar */
      .combo-bar {
        width: 120px; height: 6px;
        margin-top: 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .combo-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
        border-radius: 3px;
        transition: width 0.15s ease;
      }
      .combo-hot .hud-value { color: var(--neon-gold); text-shadow: 0 0 14px rgba(255, 210, 61, 0.8); }
      .combo-break { animation: comboBreak 0.4s ease; }
      @keyframes comboBreak {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-4px); }
        40% { transform: translateX(4px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
      }

      /* power-up effect chips */
      .hud-effects { display: flex; gap: 8px; flex-wrap: wrap; max-width: 240px; justify-content: flex-end; }
      .fx-chip {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(10, 14, 28, 0.55);
        border: 1px solid rgba(120, 220, 255, 0.22);
        backdrop-filter: blur(6px);
      }
      .fx-label {
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--text-hi);
      }
      .fx-bar {
        width: 60px; height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .fx-fill {
        display: block; height: 100%;
        background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green, #4dffa6));
        border-radius: 3px;
      }

      /* floating HTML text (banners) */
      .float-text-html {
        position: absolute;
        left: 0; top: 0;
        pointer-events: none;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 0 14px currentColor, 0 0 30px currentColor;
        white-space: nowrap;
        z-index: 15;
      }

      /* boot overlay */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 14px;
        background: var(--bg);
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .title {
        font-size: 22px; font-weight: 800;
        letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--neon-cyan);
        text-shadow: 0 0 18px rgba(53, 240, 255, 0.7);
      }
      #boot .msg { font-size: 13px; color: var(--text-lo); letter-spacing: 0.1em; }
      #boot .bar {
        width: 220px; height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #boot .bar > div {
        height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      #boot.error .title { color: #ff4d6d; text-shadow: 0 0 18px rgba(255, 77, 109, 0.7); }
      #boot.error .bar { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div id="boot">
      <div class="title">SPACE INVADERS</div>
      <div class="bar"><div></div></div>
      <div class="msg">booting renderer…</div>
    </div>
    <script type="module">
      import game from '/Space_Invaders/index.js';
      const root = document.getElementById('game');
      const boot = document.getElementById('boot');
      try {
        const handle = game.create(root);
        handle.start();
        // Debug hook: lets tooling / tests drive the full lifecycle (start,
        // pause, resume, destroy) without a dedicated test harness.
        window.__game = handle;
        // Dismiss the boot overlay once the game is live. Done on the next
        // frame so the first render has already painted behind it.
        requestAnimationFrame(() => {
          boot.classList.add('hidden');
          setTimeout(() => boot.remove(), 500);
        });
      } catch (err) {
        boot.classList.add('error');
        boot.querySelector('.title').textContent = 'BOOT FAILED';
        boot.querySelector('.msg').textContent = (err && err.message) || String(err);
        console.error('Space Invaders boot failed:', err);
      }
    </script>
  </body>
</html>
