<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders: AAA Retro-Futurism</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Glassmorphism HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 25rypt, 255, 0.2);
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-label {
            font-size: 14px;
            color: #00f2ff;
            margin-bottom: 5px;
            display: block;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f2ff;
        }

        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #game-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .menu-card {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 20px;
            color: white;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            background: linear-gradient(to bottom, #fff, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            background: rgba(0, 242, 255, 0.2);
            border: 1px solid #00f2ff;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            pointer-events: all;
        }

        .btn:hover {
            background: rgba(0, 242, 255, 0.5);
            box-shadow: 0 0 20px #00f2ff;
        }

        #game-over-text {
            font-size: 24px;
            color: #ff0055;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="glass-panel">
                <span class="score-label">Score</span>
                <span id="score-display" class="score-value">0000</span>
            </div>
            <div class="glass-panel">
                <span class="score-label">Shields</span>
                <span id="shield-display" class="score-value">100%</span>
            </div>
        </div>

        <div id="game-overlay">
            <div class="menu-card">
                <h1 id="menu-title">Space Invaders</h1>
                <div id="game-over-text">MISSION FAILED</div>
                <button id="start-btn" class="btn">Initialize</button>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
