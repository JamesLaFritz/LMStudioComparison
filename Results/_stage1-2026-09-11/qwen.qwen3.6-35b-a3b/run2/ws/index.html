<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders — Retro-Futurism</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #050510; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    /* Glassmorphism HUD Overlay */
    #hud-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    .hud-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.45);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 8px; padding: 10px 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 30px rgba(0, 255, 255, 0.05);
    }
    .hud-panel h2 { color: #0ff; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
    .hud-panel .score-value { color: #fff; font-size: 28px; font-weight: bold; text-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }

    #lives-display {
      position: absolute; bottom: 30px; left: 30px;
      color: #0ff; font-size: 18px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    #level-display {
      position: absolute; bottom: 30px; right: 30px;
      color: #f0f; font-size: 18px; text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
    }

    /* Floating score popups */
    .floating-score {
      position: absolute; color: #0ff; font-size: 20px; font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
      pointer-events: none; transition: opacity 0.6s ease-out;
    }

    /* Game Over / Start screen */
    #game-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(8px);
      z-index: 20; pointer-events: auto;
    }
    #game-overlay.hidden { display: none; }
    .overlay-content { text-align: center; }
    .overlay-content h1 { color: #0ff; font-size: 48px; letter-spacing: 6px; margin-bottom: 20px; text-shadow: 0 0 30px rgba(0,255,255,0.7); }
    .overlay-content p { color: #aaf; font-size: 16px; margin-bottom: 30px; line-height: 1.8; }
    .overlay-content button {
      background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #0ff;
      padding: 14px 40px; font-size: 18px; font-family: 'Courier New', monospace;
      cursor: pointer; letter-spacing: 3px; text-transform: uppercase;
      transition: all 0.2s; border-radius: 6px;
    }
    .overlay-content button:hover { background: rgba(0, 255, 255, 0.25); box-shadow: 0 0 25px rgba(0,255,255,0.4); }

    /* Scanline overlay */
    #scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 15; opacity: 0.4;
    }

    /* CRT vignette */
    #vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
      pointer-events: none; z-index: 14; opacity: 0.6;
    }

    /* Crosshair */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; z-index: 11; opacity: 0.3;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(0,255,255,0.6);
    }
    #crosshair::before { width: 1px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after { height: 1px; width: 100%; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="hud-overlay">
    <div class="hud-panel" id="score-panel">
      <h2>Score</h2>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div id="lives-display"></div>
    <div id="level-display"></div>
  </div>

  <div id="crosshair"></div>

  <div id="game-overlay">
    <div class="overlay-content" id="overlay-text">
      <h1>SPACE INVADERS</h1>
      <p>WASD / Arrow Keys to move &bull; Space to fire<br>Gamepad: Left Stick / D-Pad to move, A to fire</p>
      <button id="start-btn">START GAME</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
