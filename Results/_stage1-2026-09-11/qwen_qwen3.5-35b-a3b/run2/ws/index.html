<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders: Retro-Futurism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Glassmorphism UI Overlay */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        /* HUD Elements */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            z-index: 100;
        }

        .hud-item {
            color: #0ff;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.8),
                0 0 20px rgba(0, 255, 255, 0.4);
            font-size: 24px;
            font-weight: bold;
        }

        .hud-label {
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        /* Combo Counter */
        #combo-container {
            position: absolute;
            top: 80px;
            right: 30px;
            text-align: center;
            z-index: 100;
        }

        #combo-counter {
            color: #ff0;
            font-size: 48px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 
                0 0 20px rgba(255, 255, 0, 0.8),
                0 0 40px rgba(255, 255, 0, 0.4);
        }

        #combo-counter.active {
            opacity: 1;
        }

        /* Main Menu */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #main-menu.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .title-text {
            font-size: 72px;
            color: #f0f;
            text-shadow: 
                0 0 30px rgba(255, 0, 255, 1),
                0 0 60px rgba(255, 0, 255, 0.5);
            margin-bottom: 40px;
            letter-spacing: 8px;
        }

        .menu-button {
            background: linear-gradient(135deg, 
                rgba(0, 255, 255, 0.2), 
                rgba(0, 200, 255, 0.1));
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #0ff;
            padding: 16px 48px;
            font-size: 24px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .menu-button:hover {
            background: linear-gradient(135deg, 
                rgba(0, 255, 255, 0.4), 
                rgba(0, 200, 255, 0.2));
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #game-over.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .gameover-text {
            font-size: 64px;
            color: #f00;
            text-shadow: 
                0 0 30px rgba(255, 0, 0, 1),
                0 0 60px rgba(255, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 32px;
            color: #ff0;
            text-shadow: 
                0 0 20px rgba(255, 255, 0, 0.8),
                0 0 40px rgba(255, 255, 0, 0.4);
            margin-bottom: 40px;
        }

        /* CRT Scanline Effect */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* Vignette Effect */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
            background: radial-gradient(
                circle,
                transparent 60%,
                rgba(0, 0, 0, 0.8) 100%
            );
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 400;
            background: #000;
        }

        .loading-text {
            color: #0ff;
            font-size: 28px;
            text-shadow: 
                0 0 15px rgba(0, 255, 255, 0.8),
                0 0 30px rgba(0, 255, 255, 0.4);
        }

        /* Power-up Indicator */
        #powerup-indicator {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #f0f;
            font-size: 28px;
            text-shadow: 
                0 0 20px rgba(255, 0, 255, 1),
                0 0 40px rgba(255, 0, 255, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #powerup-indicator.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- CRT Effects -->
        <div id="scanlines"></div>
        <div id="vignette"></div>

        <!-- HUD -->
        <div id="hud" class="glass-panel">
            <div>
                <div class="hud-label">Score</div>
                <div id="score-display" class="hud-item">0</div>
            </div>
            <div>
                <div class="hud-label">High Score</div>
                <div id="high-score-display" class="hud-item">0</div>
            </div>
            <div>
                <div class="hud-label">Wave</div>
                <div id="wave-display" class="hud-item">1</div>
            </div>
            <div>
                <div class="hud-label">Lives</div>
                <div id="lives-display" class="hud-item">3</div>
            </div>
        </div>

        <!-- Combo Counter -->
        <div id="combo-container">
            <div id="combo-counter">x1</div>
        </div>

        <!-- Power-up Indicator -->
        <div id="powerup-indicator"></div>

        <!-- Main Menu -->
        <div id="main-menu" class="glass-panel">
            <h1 class="title-text">SPACE INVADERS</h1>
            <button class="menu-button" onclick="game.start()">START GAME</button>
            <button class="menu-button" onclick="game.showHighScore()">HIGH SCORE</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="glass-panel hidden">
            <h1 class="gameover-text">GAME OVER</h1>
            <div class="final-score">Final Score: <span id="final-score">0</span></div>
            <button class="menu-button" onclick="game.restart()">PLAY AGAIN</button>
        </div>

        <!-- Loading Screen -->
        <div id="loading">
            <div class="loading-text">LOADING...</div>
        </div>
    </div>

    <script type="module" src="/space_invaders/main.ts"></script>
</body>
</html>
