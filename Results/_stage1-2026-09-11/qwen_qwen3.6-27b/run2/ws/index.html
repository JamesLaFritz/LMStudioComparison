<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON INVASION — Space Invaders</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }

    /* ── Glassmorphism HUD ── */
    #hud-panel {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px;
      background: rgba(10, 10, 30, 0.45);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 255, 255, 0.15);
      z-index: 10; pointer-events: none;
      color: #e0f0ff;
    }
    #hud-panel .section { display: flex; align-items: center; gap: 12px; }
    #hud-panel .label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: rgba(0, 255, 255, 0.6); }
    #hud-panel .value { font-size: 22px; font-weight: 700; text-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
    #hud-panel .hp-bar { display: flex; gap: 6px; }
    #hud-panel .hp-pip { width: 28px; height: 8px; border-radius: 4px; background: #00ffff; box-shadow: 0 0 6px #00ffff; transition: background 0.2s, box-shadow 0.2s; }
    #hud-panel .hp-pip.lost { background: rgba(255, 50, 50, 0.3); box-shadow: none; }

    #hud-combo {
      font-size: 14px; font-weight: 700; color: #ffaa00;
      text-shadow: 0 0 10px rgba(255, 170, 0, 0.7);
      opacity: 0; transition: opacity 0.3s;
    }
    #hud-combo.active { opacity: 1; }

    #hud-multiplier {
      font-size: 12px; color: #ffaa00;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
    }

    /* ── Screen flash ── */
    #screen-flash {
      position: fixed; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; z-index: 8;
      transition: opacity 0.1s;
    }

    /* ── Overlay screens ── */
    .overlay-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5, 5, 16, 0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 20; color: #e0f0ff;
      opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    .overlay-screen.visible { opacity: 1; pointer-events: auto; }
    .overlay-screen h1 {
      font-size: 48px; font-weight: 800; letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 60px rgba(0, 255, 255, 0.3);
      margin-bottom: 8px;
    }
    .overlay-screen h2 {
      font-size: 28px; font-weight: 600; color: #ff4444;
      text-shadow: 0 0 16px rgba(255, 68, 68, 0.6);
      margin-bottom: 24px;
    }
    .overlay-screen .stat { font-size: 16px; margin: 4px 0; color: rgba(224, 240, 255, 0.7); }
    .overlay-screen .stat span { color: #00ffff; font-weight: 700; text-shadow: 0 0 6px rgba(0, 255, 255, 0.4); }
    .overlay-screen button {
      margin-top: 24px; padding: 12px 36px;
      background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4);
      border-radius: 8px; color: #00ffff; font-size: 16px; font-weight: 600;
      cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .overlay-screen button:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    /* ── Wave complete ── */
    #wave-overlay h1 { color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.8), 0 0 60px rgba(255, 221, 0, 0.3); }

    /* ── Start screen ── */
    #start-overlay h1 { color: #00ffff; }
    #start-overlay .subtitle { font-size: 14px; color: rgba(224, 240, 255, 0.5); margin-bottom: 16px; letter-spacing: 3px; }
    #start-overlay .controls { font-size: 12px; color: rgba(224, 240, 255, 0.4); margin-top: 12px; }
  </style>
</head>
<body>
  <!-- HUD -->
  <div id="hud-panel">
    <div class="section">
      <div>
        <div class="label">Score</div>
        <div class="value" id="hud-score">0</div>
      </div>
      <div id="hud-combo">×1</div>
      <div id="hud-multiplier"></div>
    </div>
    <div class="section">
      <div>
        <div class="label">Wave</div>
        <div class="value" id="hud-wave">1</div>
      </div>
    </div>
    <div class="section">
      <div class="label">HP</div>
      <div class="hp-bar" id="hud-hp-bar"></div>
    </div>
  </div>

  <!-- Screen flash overlay -->
  <div id="screen-flash"></div>

  <!-- Start screen -->
  <div class="overlay-screen visible" id="start-overlay">
    <h1>NEON INVASION</h1>
    <div class="subtitle">SPACE INVADERS — AAA RETRO-FUTURISM</div>
    <button id="btn-start">START</button>
    <div class="controls">WASD / Arrows to move · Space to fire · Gamepad supported</div>
  </div>

  <!-- Game over screen -->
  <div class="overlay-screen" id="game-over-overlay">
    <h2>GAME OVER</h2>
    <div class="stat">Final Score: <span id="final-score">0</span></div>
    <div class="stat">Wave Reached: <span id="final-wave">1</span></div>
    <div class="stat">Invaders Killed: <span id="final-kills">0</span></div>
    <div class="stat">Accuracy: <span id="final-accuracy">0%</span></div>
    <button id="btn-restart">PLAY AGAIN</button>
  </div>

  <!-- Wave complete overlay -->
  <div class="overlay-screen" id="wave-overlay">
    <h1 id="wave-text">WAVE 1 COMPLETE</h1>
  </div>

  <!-- Canvas container -->
  <div id="canvas-container"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
