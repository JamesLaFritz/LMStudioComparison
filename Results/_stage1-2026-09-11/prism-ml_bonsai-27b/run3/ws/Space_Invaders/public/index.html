<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    canvas {
      border: 2px solid #00ffaa;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.15);
    }

    /* CRT Scanline Overlay */
    .scanlines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
    }

    /* CRT Vignette */
    .vignette {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 998;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    #score-display {
      font-size: 28px;
      color: #00ffaa;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
      letter-spacing: 3px;
    }

    #lives-display {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .life-icon {
      width: 20px; height: 14px;
      background: #00ffaa;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%, 0% 50%);
      box-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
    }

    #wave-indicator {
      font-size: 14px;
      color: #88ffaa;
      text-shadow: 0 0 6px rgba(136, 255, 170, 0.5);
    }

    /* Floating Score Text */
    .floating-text {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      color: #ffdd00;
      text-shadow: 0 0 10px rgba(255, 221, 0, 0.8);
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    /* Start Screen */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      background: rgba(5, 5, 16, 0.9);
    }

    #start-screen h1 {
      font-size: 72px;
      color: #00ffaa;
      text-shadow: 0 0 30px rgba(0, 255, 170, 0.6), 0 0 60px rgba(0, 255, 170, 0.3);
      letter-spacing: 8px;
      margin-bottom: 24px;
    }

    #start-screen p {
      color: #88ffaa;
      font-size: 16px;
      text-align: center;
      line-height: 2;
      max-width: 500px;
    }

    .key-hint {
      display: inline-block;
      background: rgba(0, 255, 170, 0.1);
      border: 1px solid #00ffaa;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 12px;
      margin: 2px;
    }

    /* Game Over */
    #game-over-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      background: rgba(5, 5, 16, 0.95);
    }

    #game-over-screen h2 {
      font-size: 48px;
      color: #ff4444;
      text-shadow: 0 0 30px rgba(255, 68, 68, 0.6);
      letter-spacing: 4px;
      margin-bottom: 16px;
    }

    #final-score {
      font-size: 24px;
      color: #ffdd00;
      text-shadow: 0 0 15px rgba(255, 221, 0, 0.5);
      margin-bottom: 32px;
    }

    .restart-btn {
      padding: 14px 48px;
      font-size: 18px;
      color: #00ffaa;
      background: rgba(0, 255, 170, 0.1);
      border: 2px solid #00ffaa;
      cursor: pointer;
      letter-spacing: 4px;
      transition: all 0.3s;
    }

    .restart-btn:hover {
      background: rgba(0, 255, 170, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
    }

    /* Screen Flash */
    #screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: white;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .controls-hint {
      margin-top: 24px;
      font-size: 13px;
      color: #558877;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="score-display">SCORE: 0</div>
    <div id="wave-indicator">WAVE 1</div>
    <div id="lives-display"></div>
  </div>

  <!-- Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>SPACE INVADERS</h1>
    <p>
      Defend Earth from an alien invasion.<br><br>
      <span class="key-hint">← →</span> Move &nbsp; · &nbsp; <span class="key-hint">SPACE</span> Fire &nbsp; · &nbsp; <span class="key-hint">ESC</span> Pause
    </p>
    <div class="controls-hint">Press any key to start</div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over-screen" style="display:none;">
    <h2>GAME OVER</h2>
    <div id="final-score">SCORE: 0</div>
    <button class="restart-btn" onclick="window.location.reload()">PLAY AGAIN</button>
  </div>

  <!-- Screen Flash -->
  <div id="screen-flash"></div>

  <script type="module">
    import { SpaceInvaders } from './src/main.js';

    // Initialize game
    const game = new SpaceInvaders();

    // Handle window resize
    window.addEventListener('resize', () => {
      if (game) game.scene?.camera?.aspect = window.innerWidth / window.innerHeight;
    });

    // Start screen handling
    document.getElementById('start-screen').addEventListener('click', () => {
      const startScreen = document.getElementById('start-screen');
      startScreen.style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      game.engine.setState('playing');
    });

    // Keyboard input
    window.addEventListener('keydown', (e) => {
      const keys = {
        ArrowLeft: 'left',
        ArrowRight: 'right',
        Space: 'shoot',
        Escape: 'pause'
      };

      if (keys[e.key]) {
        e.preventDefault();
        game.inputHandler.keys[e.key] = true;
      }

      // Pause toggle
      if (e.key === 'Escape') {
        if (game.engine.gameState === 'playing') {
          game.engine.pause();
        } else if (game.engine.gameState === 'paused') {
          game.engine.resume();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const keys = {
        ArrowLeft: 'left',
        ArrowRight: 'right',
        Space: 'shoot'
      };
      if (keys[e.key]) {
        game.inputHandler.keys[e.key] = false;
      }
    });

    // Floating text handler
    function showFloatingText(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = (x + 100) + 'px';
      el.style.top = (y - 30) + 'px';
      el.style.color = color;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // Screen flash handler
    function flashScreen(duration = 200) {
      const flash = document.getElementById('screen-flash');
      flash.style.opacity = '0.8';
      setTimeout(() => { flash.style.opacity = '0'; }, duration);
    }
  </script>
</body>
</html>
