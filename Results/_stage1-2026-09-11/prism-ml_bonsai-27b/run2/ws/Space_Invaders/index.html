<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders — AAA Retro-Futurism</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    /* ── Canvas ─────────────────────────────────────── */
    #gameCanvas {
      display: block;
      border-radius: 4px;
      box-shadow:
        0 0 30px rgba(0, 255, 255, 0.12),
        0 0 60px rgba(0, 180, 255, 0.08);
    }

    /* ── Glassmorphism HUD Overlay ──────────────────── */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .hud-panel {
      background: rgba(8, 12, 20, 0.55);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      border: 1px solid rgba(0, 255, 255, 0.18);
      border-radius: 6px;
      padding: 10px 18px;
      color: #e0f4ff;
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    .hud-panel.top { display: flex; gap: 24px; align-items: center; }
    .hud-panel.bottom { display: flex; justify-content: space-between; align-items: flex-end; }

    .hud-label { color: rgba(0, 255, 255, 0.6); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
    .hud-value { color: #00ffff; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); }

    /* Alien type indicator bar */
    #alienIndicator {
      display: flex; gap: 12px; align-items: center; margin-top: 4px;
    }
    .alien-indicator {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: 3px; font-size: 10px; letter-spacing: 1px;
    }
    .indicator-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

    /* ── Start / Game Over Screens ──────────────────── */
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 6, 12, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      z-index: 10;
    }

    #overlay.hidden { display: none !important; }

    .title {
      font-size: 42px;
      letter-spacing: 8px;
      color: #00ffff;
      text-shadow:
        0 0 15px rgba(0, 255, 255, 0.6),
        0 0 30px rgba(0, 255, 255, 0.3);
    }

    .subtitle {
      font-size: 14px;
      color: rgba(0, 255, 255, 0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .btn {
      background: transparent;
      border: 1.5px solid #00ffff;
      color: #00ffff;
      padding: 12px 36px;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .btn:active { transform: scale(0.97); }

    .final-score {
      font-size: 18px;
      color: #aaddff;
      margin-top: 4px;
    }

    .controls-hint {
      font-size: 11px;
      color: rgba(0, 255, 255, 0.35);
      text-align: center;
      line-height: 1.8;
    }

    /* ── Floating Score Text (HTML overlay) ─────────── */
    .float-text {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 5;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    /* ── Wave Announcement ─────────────────────────── */
    #waveAnnounce {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      letter-spacing: 8px;
      color: #ff44aa;
      text-shadow: 0 0 20px rgba(255, 68, 170, 0.7), 0 0 40px rgba(255, 68, 170, 0.3);
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #waveAnnounce.visible { opacity: 1; }

    /* ── CRT Scanline Overlay ──────────────────────── */
    .scanlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
    }

    /* ── Vignette ──────────────────────────────────── */
    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
    }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 840px) {
      #gameCanvas { width: 95vw; height: auto; }
      .hud-panel { padding: 8px 12px; font-size: 11px; }
      .hud-value { font-size: 17px; }
      .title { font-size: 30px; letter-spacing: 5px; }
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- CRT Scanlines -->
<div class="scanlines"></div>

<!-- Vignette -->
<div class="vignette"></div>

<!-- HUD Overlay (Glassmorphism) -->
<div id="hud">
  <div class="hud-panel top">
    <div>
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div>
      <div class="hud-label">Wave</div>
      <div class="hud-value" id="waveDisplay">1</div>
    </div>
  </div>

  <!-- Alien type indicator -->
  <div id="alienIndicator"></div>

  <div class="hud-panel bottom">
    <div>
      <div class="hud-label">Lives</div>
      <div class="hud-value" id="livesDisplay">3</div>
    </div>
    <div>
      <div class="hud-label">High Score</div>
      <div class="hud-value" id="highScoreDisplay">0</div>
    </div>
  </div>
</div>

<!-- Wave Announcement -->
<div id="waveAnnounce"></div>

<!-- Start / Game Over Overlay -->
<div id="overlay">
  <div class="title">SPACE INVADERS</div>
  <div class="subtitle" id="overlaySubtitle">AAA Retro-Futurism Edition</div>
  <button class="btn" id="startBtn">INSERT COIN — START</button>
  <div class="controls-hint">
    WASD / Arrows to move &nbsp;·&nbsp; Space to fire<br>
    Gamepad supported
  </div>
</div>

<script type="module">
import { initScene, renderLoop } from './main.js';

// ── DOM References ────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const scoreDisplay = document.getElementById('scoreDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const overlay = document.getElementById('overlay');
const overlaySubtitle = document.getElementById('overlaySubtitle');
const startBtn = document.getElementById('startBtn');
const waveAnnounce = document.getElementById('waveAnnounce');
const alienIndicatorEl = document.getElementById('alienIndicator');

// ── Load Game ─────────────────────────────────────
const game = await initScene();

// ── UI Update Helpers ─────────────────────────────
function updateHUD() {
  scoreDisplay.textContent = game.score.toLocaleString();
  waveDisplay.textContent = game.wave;
  livesDisplay.textContent = game.lives;
  highScoreDisplay.textContent = game.highScore.toLocaleString();
}

function showOverlay(title, subtitle) {
  overlay.classList.remove('hidden');
  document.getElementById('overlayTitle').textContent = title;
  overlaySubtitle.textContent = subtitle;
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

// ── Floating Score Text (HTML) ────────────────────
function spawnFloatingScore(x, y, points, color) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.textContent = '+' + points;
  el.style.color = color || '#00ffff';
  el.style.textShadow = `0 0 8px ${color || '#00ffff'}`;
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showWaveAnnounce(waveNum) {
  waveAnnounce.textContent = 'WAVE ' + waveNum;
  waveAnnounce.classList.add('visible');
  setTimeout(() => waveAnnounce.classList.remove('visible'), 2000);
}

// ── Alien Indicator Bar ───────────────────────────
function updateAlienIndicator() {
  alienIndicatorEl.innerHTML = '';
  const types = [
    { label: 'SQUID', color: '#00ffff', count: game.alienGrid.squidCount },
    { label: 'CRAB',  color: '#ff44aa', count: game.alienGrid.crabCount },
    { label: 'OCTOPUS',color: '#ffcc00', count: game.alienGrid.octopusCount },
  ];
  types.forEach(t => {
    if (t.count > 0) {
      const el = document.createElement('span');
      el.className = 'alien-indicator';
      el.style.borderColor = t.color + '44';
      el.innerHTML = `<span class="indicator-dot" style="background:${t.color}"></span> ${t.label}: ${t.count}`;
      alienIndicatorEl.appendChild(el);
    }
  });
}

// ── Start Button ──────────────────────────────────
startBtn.addEventListener('click', () => {
  hideOverlay();
  game.start();
});

// ── Keyboard Input ────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.code)) {
    e.preventDefault();
  }
  game.inputHandler.keys[e.code] = true;
});

document.addEventListener('keyup', (e) => {
  game.inputHandler.keys[e.code] = false;
});

// ── Gamepad Input ─────────────────────────────────
const gamepadMap = {
  'ArrowLeft': 'left', 'ArrowRight': 'right', 'Space': 'fire',
  'KeyA': 'left', 'KeyD': 'right', 'KeyW': 'up', 'KeyS': 'down',
};

document.addEventListener('gamestart', (e) => {
  e.preventDefault();
  game.inputHandler.keys[e.action] = true;
});

document.addEventListener('gameend', (e) => {
  e.preventDefault();
  game.inputHandler.keys[e.action] = false;
});

// ── Start Game ────────────────────────────────────
window.addEventListener('load', () => {
  showOverlay('SPACE INVADERS', 'AAA Retro-Futurism Edition');
});

updateHUD();

</script>
</body>
</html>
