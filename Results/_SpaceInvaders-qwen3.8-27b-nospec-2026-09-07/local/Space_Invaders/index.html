<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPACE INVADERS — NEON ARCADE</title>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff2d78;
      --neon-amber: #ffb300;
      --neon-green: #39ff88;
      --glass: rgba(10, 16, 30, 0.55);
      --glass-border: rgba(0, 240, 255, 0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #04060c;
      color: #dfe9ff;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    }
    /* ---- HUD overlay ---- */
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      font-variant-numeric: tabular-nums;
    }
    .hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 16px 22px;
    }
    .cluster {
      display: flex; gap: 18px; align-items: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .cluster.center { flex-direction: column; gap: 4px; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat .label {
      font-size: 9px; letter-spacing: 0.3em; color: #6d84ad; text-transform: uppercase;
    }
    .stat .value {
      font-size: 22px; font-weight: 800; letter-spacing: 0.04em; color: #f2f7ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }
    .stat .value.hi { color: var(--neon-amber); text-shadow: 0 0 12px rgba(255, 179, 0, 0.5); }
    .stat.wave .value { color: var(--neon-cyan); }
    .combo {
      font-size: 15px; font-weight: 700; color: var(--neon-magenta);
      text-shadow: 0 0 10px currentColor; letter-spacing: 0.08em;
    }
    .lives { display: flex; gap: 6px; }
    .lives .pip {
      width: 14px; height: 14px; border-radius: 3px;
      background: linear-gradient(135deg, var(--neon-cyan), #7df9ff);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      transform: rotate(45deg);
    }
    /* ---- overlays ---- */
    .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4, 6, 12, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .overlay[hidden] { display: none; }
    .panel {
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 34px 54px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 60px -10px rgba(0, 240, 255, 0.35);
    }
    .panel h2 {
      font-size: 34px; font-weight: 800; letter-spacing: 0.22em;
      background: linear-gradient(90deg, var(--neon-cyan), #7df9ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.5));
      margin-bottom: 14px;
    }
    .panel.over h2 {
      background: linear-gradient(90deg, var(--neon-magenta), #ff7ab8);
      -webkit-background-clip: text; background-clip: text;
      filter: drop-shadow(0 0 14px rgba(255, 45, 120, 0.5));
    }
    .panel p { color: #93a7cc; font-size: 13px; letter-spacing: 0.06em; margin-top: 10px; }
    .final { display: flex; gap: 34px; justify-content: center; margin: 10px 0 4px; }
    .final .stat .value { font-size: 30px; }
    kbd {
      background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.25);
      border-bottom-width: 2px; border-radius: 5px; padding: 1px 7px; font-size: 11px;
      color: #bfe9ff; font-family: inherit;
    }
    /* ---- screen flash ---- */
    .flash {
      position: absolute; inset: 0;
      background: #fff; opacity: 0; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
